<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotWire 4D CNC - Пенопласт</title>
<style>
:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --accent: #0f3460;
  --highlight: #e94560;
  --text: #eee;
  --green: #4caf50;
  --orange: #ff9800;
  --blue: #2196f3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; }
#app { display:grid; grid-template-columns:320px 1fr 300px; grid-template-rows:50px 1fr 200px; height:100vh; }
header { grid-column:1/-1; background:var(--accent); display:flex; align-items:center; padding:0 20px; gap:15px; border-bottom:2px solid var(--highlight); }
header h1 { font-size:18px; color:var(--highlight); }
header .btn { padding:6px 14px; border:none; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold; }
header .btn-gen { background:var(--green); color:#fff; }
header .btn-sim { background:var(--orange); color:#fff; }
header .btn-export { background:var(--blue); color:#fff; }
header .btn-clear { background:#666; color:#fff; }
.sidebar-left { background:var(--panel); padding:10px; overflow-y:auto; border-right:1px solid #333; }
.viewport { position:relative; background:#0a0a1a; overflow:hidden; }
.sidebar-right { background:var(--panel); padding:10px; overflow-y:auto; border-left:1px solid #333; }
.gcode-panel { grid-column:1/-1; background:#0d0d1a; border-top:1px solid #333; padding:10px; display:flex; flex-direction:column; }
.gcode-panel textarea { flex:1; background:#111; color:#0f0; font-family:'Courier New',monospace; font-size:11px; border:1px solid #333; padding:8px; resize:none; }
.section { margin-bottom:15px; }
.section h3 { font-size:12px; color:var(--highlight); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
.param-row { display:flex; align-items:center; margin-bottom:6px; gap:8px; }
.param-row label { font-size:11px; flex:1; color:#aaa; }
.param-row input[type="range"] { width:100px; }
.param-row input[type="number"] { width:60px; background:#222; border:1px solid #444; color:#fff; padding:3px 5px; font-size:11px; border-radius:3px; }
.param-row .val { font-size:11px; color:var(--green); min-width:40px; text-align:right; }
canvas#editorCanvas { width:100%; height:100%; cursor:crosshair; }
canvas#viewport3d { width:100%; height:100%; }
.tool-btn { display:block; width:100%; padding:8px; margin-bottom:5px; background:var(--accent); border:1px solid #444; color:var(--text); border-radius:4px; cursor:pointer; font-size:11px; text-align:left; }
.tool-btn:hover { background:var(--highlight); }
.tool-btn.active { background:var(--highlight); border-color:#fff; }
.status-bar { position:absolute; bottom:5px; left:5px; font-size:10px; color:#888; background:rgba(0,0,0,0.7); padding:3px 8px; border-radius:3px; }
.sim-controls { display:flex; gap:5px; margin-bottom:10px; }
.sim-controls button { flex:1; padding:6px; border:none; border-radius:3px; cursor:pointer; font-size:11px; font-weight:bold; }
.sim-controls .play { background:var(--green); color:#fff; }
.sim-controls .stop { background:var(--highlight); color:#fff; }
.sim-controls .reset { background:#666; color:#fff; }
.info-box { background:#111; border:1px solid #333; padding:8px; border-radius:4px; font-size:10px; margin-top:10px; }
.info-box div { margin-bottom:3px; }
.info-box span { color:var(--green); }
.tab-bar { display:flex; gap:2px; margin-bottom:10px; }
.tab-bar button { flex:1; padding:5px; border:none; background:#222; color:#888; font-size:10px; cursor:pointer; border-radius:3px 3px 0 0; }
.tab-bar button.active { background:var(--accent); color:#fff; }
.profile-select { width:100%; padding:5px; background:#222; border:1px solid #444; color:#fff; border-radius:3px; font-size:11px; margin-bottom:10px; }
</style>
</head>
<body>
<div id="app">
<header>
  <h1>⚡ HotWire 4D CNC</h1>
  <button class="btn btn-gen" onclick="generateGCode()">▶ Генерация G-Code</button>
  <button class="btn btn-sim" onclick="toggleSimulation()">⏯ Симуляция</button>
  <button class="btn btn-export" onclick="exportGCode()">💾 Экспорт .nc</button>
  <button class="btn btn-clear" onclick="clearAll()">✕ Очистить</button>
</header>

<div class="sidebar-left">
  <div class="section">
    <h3>🎨 Редактор профилей</h3>
    <select class="profile-select" id="profileSelect" onchange="switchProfile()">
      <option value="left">Левый вектор (профиль)</option>
      <option value="right">Правый вектор (профиль)</option>
      <option value="start">Стартовая линия</option>
    </select>
    <button class="tool-btn" id="btnDraw" onclick="setTool('draw')">✏️ Рисовать кривую</button>
    <button class="tool-btn" id="btnMove" onclick="setTool('move')">↔️ Двигать точки</button>
    <button class="tool-btn" id="btnErase" onclick="setTool('erase')">🗑️ Удалить точки</button>
    <button class="tool-btn" onclick="smoothCurve()">〰️ Сгладить кривую</button>
    <button class="tool-btn" onclick="closeCurve()">⭕ Замкнуть кривую</button>
  </div>

  <div class="section">
    <h3>⚙️ Параметры станка</h3>
    <div class="param-row">
      <label>Точки на мм</label>
      <input type="range" id="pointsPerMM" min="0.01" max="1" step="0.01" value="0.26" oninput="updateParam(this)">
      <span class="val" id="pointsPerMM_val">0.26</span>
    </div>
    <div class="param-row">
      <label>Отступ лево</label>
      <input type="range" id="offsetLeft" min="-10" max="10" step="0.1" value="0" oninput="updateParam(this)">
      <span class="val" id="offsetLeft_val">0.0</span>
    </div>
    <div class="param-row">
      <label>Отступ право</label>
      <input type="range" id="offsetRight" min="-10" max="10" step="0.1" value="0" oninput="updateParam(this)">
      <span class="val" id="offsetRight_val">0.0</span>
    </div>
  </div>

  <div class="section">
    <h3>📐 Габариты рабочей зоны</h3>
    <div class="param-row">
      <label>Ширина (мм)</label>
      <input type="number" id="workWidth" value="2100" min="10" max="2100" onchange="updateWorkArea()">
    </div>
    <div class="param-row">
      <label>Длина (мм)</label>
      <input type="number" id="workLength" value="2400" min="10" max="2400" onchange="updateWorkArea()">
    </div>
    <div class="param-row">
      <label>Высота (мм)</label>
      <input type="number" id="workHeight" value="1300" min="10" max="1300" onchange="updateWorkArea()">
    </div>
  </div>

  <div class="section">
    <h3>📝 G-Code настройки</h3>
    <div class="param-row">
      <label>Масштаб</label>
      <select id="gcodeScale" style="width:60px;background:#222;border:1px solid #444;color:#fff;padding:2px;font-size:11px;">
        <option value="1">1</option>
        <option value="10">10</option>
        <option value="100">100</option>
        <option value="1000">1000</option>
      </select>
    </div>
    <div class="param-row">
      <label>Скорость (F)</label>
      <input type="number" id="feedRate" value="300" min="1" max="5000">
    </div>
    <div class="param-row">
      <label>Знаков после точки</label>
      <input type="number" id="decimals" value="3" min="1" max="6" style="width:40px;">
    </div>
  </div>
</div>

<div class="viewport" id="viewport">
  <canvas id="editorCanvas"></canvas>
  <div class="status-bar" id="statusBar">Готово | Точек: 0</div>
</div>

<div class="sidebar-right">
  <div class="section">
    <h3>🎮 Симуляция</h3>
    <div class="sim-controls">
      <button class="play" onclick="startSim()">▶</button>
      <button class="stop" onclick="stopSim()">⏸</button>
      <button class="reset" onclick="resetSim()">⏹</button>
    </div>
    <div class="param-row">
      <label>Скорость</label>
      <input type="range" id="simSpeed" min="0.001" max="0.05" step="0.001" value="0.005" oninput="updateParam(this)">
      <span class="val" id="simSpeed_val">0.005</span>
    </div>
    <canvas id="viewport3d" width="280" height="300" style="background:#0a0a1a;border:1px solid #333;border-radius:4px;"></canvas>
  </div>

  <div class="section">
    <h3>📊 Информация</h3>
    <div class="info-box" id="infoBox">
      <div>Точек левый: <span id="infoLeftPts">0</span></div>
      <div>Точек правый: <span id="infoRightPts">0</span></div>
      <div>Строк G-кода: <span id="infoGcodeLines">0</span></div>
      <div>Длина пути: <span id="infoPathLen">0</span> мм</div>
      <div>Параметр: <span id="infoParam">0.000</span></div>
    </div>
  </div>

  <div class="section">
    <h3>📋 Заголовок</h3>
    <textarea id="gcodeHeader" style="width:100%;height:80px;background:#111;color:#0f0;font-family:monospace;font-size:10px;border:1px solid #333;padding:5px;resize:none;">G90 G92 G80 G17
T1M6
G54
M7
M8</textarea>
  </div>

  <div class="section">
    <h3>📋 Конец программы</h3>
    <textarea id="gcodeFooter" style="width:100%;height:40px;background:#111;color:#0f0;font-family:monospace;font-size:10px;border:1px solid #333;padding:5px;resize:none;">M9
M30</textarea>
  </div>
</div>

<div class="gcode-panel">
  <h3 style="font-size:11px;color:var(--highlight);margin-bottom:5px;">G-CODE OUTPUT</h3>
  <textarea id="gcodeOutput" readonly placeholder="Нажмите 'Генерация G-Code' для создания программы..."></textarea>
</div>
</div>

<script>
// ==================== GLOBAL STATE ====================
const state = {
  profiles: {
    left: [],
    right: [],
    start: []
  },
  currentProfile: 'left',
  tool: 'draw',
  drawing: false,
  selectedPoint: -1,
  workArea: { width: 2100, length: 2400, height: 1300 },
  simulation: { running: false, param: 0, speed: 0.005 },
  gcode: [],
  toolpath: []
};

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('editorCanvas');
const ctx = canvas.getContext('2d');
const canvas3d = document.getElementById('viewport3d');
const ctx3d = canvas3d.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  redraw();
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);

// ==================== DRAWING TOOLS ====================
function setTool(tool) {
  state.tool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + tool.charAt(0).toUpperCase() + tool.slice(1)).classList.add('active');
}

function switchProfile() {
  state.currentProfile = document.getElementById('profileSelect').value;
  redraw();
}

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const pts = state.profiles[state.currentProfile];

  if (state.tool === 'draw') {
    pts.push({ x, y });
    redraw();
  } else if (state.tool === 'move') {
    state.selectedPoint = findNearestPoint(pts, x, y, 15);
    if (state.selectedPoint >= 0) state.drawing = true;
  } else if (state.tool === 'erase') {
    const idx = findNearestPoint(pts, x, y, 15);
    if (idx >= 0) { pts.splice(idx, 1); redraw(); }
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (state.drawing && state.selectedPoint >= 0) {
    const rect = canvas.getBoundingClientRect();
    const pts = state.profiles[state.currentProfile];
    pts[state.selectedPoint].x = e.clientX - rect.left;
    pts[state.selectedPoint].y = e.clientY - rect.top;
    redraw();
  }
});

canvas.addEventListener('mouseup', () => { state.drawing = false; state.selectedPoint = -1; });

function findNearestPoint(pts, x, y, threshold) {
  let minDist = threshold, idx = -1;
  for (let i = 0; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - x, pts[i].y - y);
    if (d < minDist) { minDist = d; idx = i; }
  }
  return idx;
}

function smoothCurve() {
  const pts = state.profiles[state.currentProfile];
  if (pts.length < 3) return;
  const smoothed = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    smoothed.push({
      x: pts[i-1].x * 0.25 + pts[i].x * 0.5 + pts[i+1].x * 0.25,
      y: pts[i-1].y * 0.25 + pts[i].y * 0.5 + pts[i+1].y * 0.25
    });
  }
  smoothed.push(pts[pts.length - 1]);
  state.profiles[state.currentProfile] = smoothed;
  redraw();
}

function closeCurve() {
  const pts = state.profiles[state.currentProfile];
  if (pts.length > 2) {
    pts.push({ ...pts[0] });
    redraw();
  }
}

// ==================== RENDERING ====================
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawProfile(state.profiles.left, '#ff4444', 'Левый');
  drawProfile(state.profiles.right, '#44aaff', 'Правый');
  drawProfile(state.profiles.start, '#44ff44', 'Старт');
  highlightCurrent();
  updateStatus();
}

function drawGrid() {
  ctx.strokeStyle = '#1a1a3a';
  ctx.lineWidth = 0.5;
  const step = 50;
  for (let x = 0; x < canvas.width; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function drawProfile(pts, color, label) {
  if (pts.length === 0) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.stroke();
  // Points
  ctx.fillStyle = color;
  for (const p of pts) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function highlightCurrent() {
  const pts = state.profiles[state.currentProfile];
  if (pts.length === 0) return;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function updateStatus() {
  const total = state.profiles.left.length + state.profiles.right.length + state.profiles.start.length;
  document.getElementById('statusBar').textContent = 
    `Профиль: ${state.currentProfile} | Точек: ${state.profiles[state.currentProfile].length} | Всего: ${total} | Инструмент: ${state.tool}`;
  document.getElementById('infoLeftPts').textContent = state.profiles.left.length;
  document.getElementById('infoRightPts').textContent = state.profiles.right.length;
}

// ==================== PARAMETER UPDATES ====================
function updateParam(el) {
  document.getElementById(el.id + '_val').textContent = parseFloat(el.value).toFixed(3);
}

function updateWorkArea() {
  state.workArea.width = parseInt(document.getElementById('workWidth').value) || 2100;
  state.workArea.length = parseInt(document.getElementById('workLength').value) || 2400;
  state.workArea.height = parseInt(document.getElementById('workHeight').value) || 1300;
}

// ==================== G-CODE GENERATION ====================
function generateGCode() {
  const leftPts = state.profiles.left;
  const rightPts = state.profiles.right;
  
  if (leftPts.length < 2 || rightPts.length < 2) {
    alert('Необходимо нарисовать хотя бы левый и правый профили (минимум 2 точки каждый)!');
    return;
  }

  const pointsPerMM = parseFloat(document.getElementById('pointsPerMM').value);
  const offsetL = parseFloat(document.getElementById('offsetLeft').value);
  const offsetR = parseFloat(document.getElementById('offsetRight').value);
  const scale = parseInt(document.getElementById('gcodeScale').value);
  const decimals = parseInt(document.getElementById('decimals').value);
  const feedRate = parseInt(document.getElementById('feedRate').value);
  
  // Interpolate curves to uniform spacing
  const leftInterp = interpolateCurve(leftPts, pointsPerMM, offsetL);
  const rightInterp = interpolateCurve(rightPts, pointsPerMM, offsetR);
  
  // Ensure same number of points
  const numPoints = Math.min(leftInterp.length, rightInterp.length);
  
  // Generate toolpath
  state.toolpath = [];
  for (let i = 0; i < numPoints; i++) {
    const lp = leftInterp[i];
    const rp = rightInterp[i];
    
    // Coordinate mapping from Grasshopper file:
    // Y world axis = X and A axis
    // Z world axis = Y and B axis
    // Left point -> X, Y (position of left wire end)
    // Right point -> A, B (position of right wire end)
    state.toolpath.push({
      X: (lp.y * scale),  // world Y -> machine X
      Y: (lp.x * scale),  // world Z -> machine Y  
      A: (rp.y * scale),  // right Y -> machine A
      B: (rp.x * scale)   // right Z -> machine B
    });
  }
  
  // Build G-code
  const header = document.getElementById('gcodeHeader').value.trim();
  const footer = document.getElementById('gcodeFooter').value.trim();
  
  let lines = [];
  // Header
  lines.push(...header.split('\n'));
  // Replace feed rate
  lines = lines.map(l => l.replace(/F\d+/, 'F' + feedRate));
  lines.push('F' + feedRate);
  
  // Toolpath
  for (const pt of state.toolpath) {
    const x = pt.X.toFixed(decimals);
    const y = pt.Y.toFixed(decimals);
    const a = pt.A.toFixed(decimals);
    const b = pt.B.toFixed(decimals);
    lines.push(`G1 X${x} Y${y} A${a} B${b}`);
  }
  
  // Footer
  lines.push(...footer.split('\n'));
  
  state.gcode = lines;
  document.getElementById('gcodeOutput').value = lines.join('\n');
  document.getElementById('infoGcodeLines').textContent = lines.length;
  
  // Calculate path length
  let pathLen = 0;
  for (let i = 1; i < state.toolpath.length; i++) {
    pathLen += Math.hypot(
      state.toolpath[i].X - state.toolpath[i-1].X,
      state.toolpath[i].Y - state.toolpath[i-1].Y
    );
  }
  document.getElementById('infoPathLen').textContent = (pathLen / scale).toFixed(1);
  
  render3DPreview();
}

function interpolateCurve(points, pointsPerMM, offset) {
  if (points.length < 2) return points;
  
  // Calculate total length
  let totalLen = 0;
  for (let i = 1; i < points.length; i++) {
    totalLen += Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
  }
  
  const numPoints = Math.max(2, Math.round(totalLen * pointsPerMM));
  const result = [];
  
  for (let i = 0; i <= numPoints; i++) {
    const t = i / numPoints;
    const pt = getPointOnPolyline(points, t);
    
    // Apply offset (perpendicular to curve direction)
    if (offset !== 0) {
      const normal = getNormalAtT(points, t);
      pt.x += normal.x * offset;
      pt.y += normal.y * offset;
    }
    
    result.push(pt);
  }
  
  return result;
}

function getPointOnPolyline(points, t) {
  const totalLen = getPolylineLength(points);
  const targetLen = t * totalLen;
  let accLen = 0;
  
  for (let i = 1; i < points.length; i++) {
    const segLen = Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
    if (accLen + segLen >= targetLen) {
      const localT = (targetLen - accLen) / segLen;
      return {
        x: points[i-1].x + (points[i].x - points[i-1].x) * localT,
        y: points[i-1].y + (points[i].y - points[i-1].y) * localT
      };
    }
    accLen += segLen;
  }
  return { ...points[points.length - 1] };
}

function getPolylineLength(points) {
  let len = 0;
  for (let i = 1; i < points.length; i++) {
    len += Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
  }
  return len;
}

function getNormalAtT(points, t) {
  const p1 = getPointOnPolyline(points, Math.max(0, t - 0.01));
  const p2 = getPointOnPolyline(points, Math.min(1, t + 0.01));
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const len = Math.hypot(dx, dy) || 1;
  return { x: -dy / len, y: dx / len };
}

// ==================== 3D PREVIEW ====================
function render3DPreview() {
  ctx3d.clearRect(0, 0, canvas3d.width, canvas3d.height);
  
  if (state.toolpath.length === 0) {
    ctx3d.fillStyle = '#666';
    ctx3d.font = '12px sans-serif';
    ctx3d.textAlign = 'center';
    ctx3d.fillText('Нет данных для отображения', canvas3d.width/2, canvas3d.height/2);
    return;
  }
  
  const w = canvas3d.width;
  const h = canvas3d.height;
  const scale = Math.min(w, h) / (state.workArea.width + 100);
  const ox = w / 2;
  const oy = h / 2;
  
  // Draw work area
  ctx3d.strokeStyle = '#333';
  ctx3d.strokeRect(20, 20, w - 40, h - 40);
  
  // Draw wire path (simple 2D projection)
  const maxPts = Math.min(state.toolpath.length, 500);
  const step = Math.max(1, Math.floor(state.toolpath.length / maxPts));
  
  // Left end path (X, Y)
  ctx3d.beginPath();
  ctx3d.strokeStyle = '#ff4444';
  ctx3d.lineWidth = 1;
  for (let i = 0; i < state.toolpath.length; i += step) {
    const pt = state.toolpath[i];
    const x = 20 + (pt.X / (state.workArea.width * parseInt(document.getElementById('gcodeScale').value))) * (w - 40);
    const y = 20 + (pt.Y / (state.workArea.height * parseInt(document.getElementById('gcodeScale').value))) * (h - 40);
    if (i === 0) ctx3d.moveTo(x, y);
    else ctx3d.lineTo(x, y);
  }
  ctx3d.stroke();
  
  // Right end path (A, B)
  ctx3d.beginPath();
  ctx3d.strokeStyle = '#44aaff';
  ctx3d.lineWidth = 1;
  for (let i = 0; i < state.toolpath.length; i += step) {
    const pt = state.toolpath[i];
    const x = 20 + (pt.A / (state.workArea.width * parseInt(document.getElementById('gcodeScale').value))) * (w - 40);
    const y = 20 + (pt.B / (state.workArea.height * parseInt(document.getElementById('gcodeScale').value))) * (h - 40);
    if (i === 0) ctx3d.moveTo(x, y);
    else ctx3d.lineTo(x, y);
  }
  ctx3d.stroke();
  
  // Legend
  ctx3d.fillStyle = '#ff4444';
  ctx3d.fillRect(25, h - 35, 10, 3);
  ctx3d.fillStyle = '#aaa';
  ctx3d.font = '9px sans-serif';
  ctx3d.textAlign = 'left';
  ctx3d.fillText('Левый конец (X,Y)', 40, h - 32);
  
  ctx3d.fillStyle = '#44aaff';
  ctx3d.fillRect(25, h - 22, 10, 3);
  ctx3d.fillStyle = '#aaa';
  ctx3d.fillText('Правый конец (A,B)', 40, h - 19);
}

// ==================== SIMULATION ====================
let simInterval = null;

function startSim() {
  if (state.toolpath.length === 0) {
    alert('Сначала сгенерируйте G-код!');
    return;
  }
  state.simulation.running = true;
  if (!simInterval) {
    simInterval = setInterval(simulationStep, 20); // 20ms like in Grasshopper
  }
}

function stopSim() {
  state.simulation.running = false;
}

function resetSim() {
  state.simulation.running = false;
  state.simulation.param = 0;
  if (simInterval) { clearInterval(simInterval); simInterval = null; }
  render3DPreview();
  document.getElementById('infoParam').textContent = '0.000';
}

function simulationStep() {
  if (!state.simulation.running) return;
  
  const speed = parseFloat(document.getElementById('simSpeed').value);
  state.simulation.param += speed;
  
  if (state.simulation.param > 1) {
    state.simulation.param = 0;
  }
  
  document.getElementById('infoParam').textContent = state.simulation.param.toFixed(3);
  renderSimulationFrame();
}

function renderSimulationFrame() {
  ctx3d.clearRect(0, 0, canvas3d.width, canvas3d.height);
  const w = canvas3d.width, h = canvas3d.height;
  const scale = parseInt(document.getElementById('gcodeScale').value);
  
  // Background
  ctx3d.fillStyle = '#0a0a1a';
  ctx3d.fillRect(0, 0, w, h);
  
  // Work area border
  ctx3d.strokeStyle = '#333';
  ctx3d.strokeRect(20, 20, w - 40, h - 40);
  
  if (state.toolpath.length === 0) return;
  
  const idx = Math.floor(state.simulation.param * (state.toolpath.length - 1));
  const pt = state.toolpath[idx];
  
  // Calculate screen positions
  const lx = 20 + (pt.X / (state.workArea.width * scale)) * (w - 40);
  const ly = 20 + (pt.Y / (state.workArea.height * scale)) * (h - 40);
  const rx = 20 + (pt.A / (state.workArea.width * scale)) * (w - 40);
  const ry = 20 + (pt.B / (state.workArea.height * scale)) * (h - 40);
  
  // Draw path up to current point
  ctx3d.beginPath();
  ctx3d.strokeStyle = 'rgba(255,68,68,0.3)';
  ctx3d.lineWidth = 1;
  for (let i = 0; i <= idx; i++) {
    const p = state.toolpath[i];
    const x = 20 + (p.X / (state.workArea.width * scale)) * (w - 40);
    const y = 20 + (p.Y / (state.workArea.height * scale)) * (h - 40);
    if (i === 0) ctx3d.moveTo(x, y); else ctx3d.lineTo(x, y);
  }
  ctx3d.stroke();
  
  // Draw wire (line between left and right endpoints)
  ctx3d.beginPath();
  ctx3d.strokeStyle = '#ff0';
  ctx3d.lineWidth = 2;
  ctx3d.moveTo(lx, ly);
  ctx3d.lineTo(rx, ry);
  ctx3d.stroke();
  
  // Draw endpoints
  ctx3d.beginPath();
  ctx3d.fillStyle = '#ff4444';
  ctx3d.arc(lx, ly, 5, 0, Math.PI * 2);
  ctx3d.fill();
  
  ctx3d.beginPath();
  ctx3d.fillStyle = '#44aaff';
  ctx3d.arc(rx, ry, 5, 0, Math.PI * 2);
  ctx3d.fill();
  
  // Labels
  ctx3d.fillStyle = '#fff';
  ctx3d.font = '9px monospace';
  ctx3d.textAlign = 'left';
  ctx3d.fillText(`X:${pt.X.toFixed(1)} Y:${pt.Y.toFixed(1)}`, 25, 15);
  ctx3d.fillText(`A:${pt.A.toFixed(1)} B:${pt.B.toFixed(1)}`, 150, 15);
  ctx3d.fillText(`t=${state.simulation.param.toFixed(3)}`, w - 70, 15);
}

function toggleSimulation() {
  if (state.simulation.running) stopSim();
  else startSim();
}

// ==================== EXPORT ====================
function exportGCode() {
  const gcode = document.getElementById('gcodeOutput').value;
  if (!gcode) {
    alert('Сначала сгенерируйте G-код!');
    return;
  }
  
  const blob = new Blob([gcode], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hotwire4d.nc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ==================== CLEAR ====================
function clearAll() {
  if (!confirm('Очистить все данные?')) return;
  state.profiles.left = [];
  state.profiles.right = [];
  state.profiles.start = [];
  state.toolpath = [];
  state.gcode = [];
  state.simulation.param = 0;
  state.simulation.running = false;
  document.getElementById('gcodeOutput').value = '';
  resetSim();
  redraw();
}

// ==================== DEMO DATA ====================
function loadDemo() {
  // Create a simple demo profile
  const cx = canvas.width / 2, cy = canvas.height / 2;
  
  // Left profile - a simple airfoil shape
  state.profiles.left = [];
  for (let i = 0; i <= 30; i++) {
    const t = i / 30;
    const angle = t * Math.PI;
    state.profiles.left.push({
      x: cx - 100 + Math.cos(angle) * 80,
      y: cy - 50 + Math.sin(angle) * 40 - Math.sin(t * Math.PI) * 20
    });
  }
  
  // Right profile - slightly different
  state.profiles.right = [];
  for (let i = 0; i <= 30; i++) {
    const t = i / 30;
    const angle = t * Math.PI;
    state.profiles.right.push({
      x: cx + 100 + Math.cos(angle) * 60,
      y: cy - 30 + Math.sin(angle) * 50 - Math.sin(t * Math.PI) * 30
    });
  }
  
  // Start line
  state.profiles.start = [
    { x: cx - 100, y: cy - 50 },
    { x: cx + 100, y: cy - 30 }
  ];
  
  redraw();
}

// Initialize
setTool('draw');
loadDemo();
redraw();
</script>
